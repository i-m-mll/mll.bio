name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch writing content from monorepo
        env:
          MAIN_REPO_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}
          MONO_CHECKOUT_DIR: /tmp/main-repo
          MONO_PREFIX: /Users/mll/Main/
          EXPECTED_CONTENT_SYMLINK_COUNT: "4"
        run: |
          set -euo pipefail

          if [ -z "${MAIN_REPO_TOKEN:-}" ]; then
            echo "MAIN_REPO_TOKEN is required to fetch writing content" >&2
            exit 1
          fi

          # Sparse-checkout 20 Writing/ from i-m-mll/main
          rm -rf "$MONO_CHECKOUT_DIR"
          mkdir -p "$MONO_CHECKOUT_DIR" && cd "$MONO_CHECKOUT_DIR"
          git init -q
          git remote add origin "https://x-access-token:${MAIN_REPO_TOKEN}@github.com/i-m-mll/main.git"
          git sparse-checkout init --cone
          git sparse-checkout set "20 Writing/10 Posts" "20 Writing/15 Series"
          git pull --depth=1 origin main -q

          cd "$GITHUB_WORKSPACE"
          scripts/resolve-ci-content.sh

      - name: Copy series assets to public/
        run: |
          set -euo pipefail

          # Copy assets/ from each series content directory to public/series/<slug>/assets/
          # so Next.js static export can serve them. Assets are now plain files in the monorepo.
          for series_dir in "$GITHUB_WORKSPACE"/content/series/*/; do
            slug=$(basename "$series_dir")
            src="$series_dir/assets"
            dst="$GITHUB_WORKSPACE/public/series/$slug/assets"
            if [ -d "$src" ]; then
              mkdir -p "$(dirname "$dst")"
              cp -r "$src" "$dst"
              count=$(find "$dst" -type f | wc -l | tr -d ' ')
              echo "Copied $count assets for: $slug"
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
