name: Deploy to GitHub Pages

on:
  push:
    branches: [main, feature/fix-ci]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch writing content from monorepo
        env:
          MAIN_REPO_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}
        run: |
          # Sparse-checkout 20 Writing/ from i-m-mll/main
          mkdir -p /tmp/main-repo && cd /tmp/main-repo
          git init -q
          git remote add origin "https://x-access-token:${MAIN_REPO_TOKEN}@github.com/i-m-mll/main.git"
          git sparse-checkout init --cone
          git sparse-checkout set "20 Writing/10 Posts" "20 Writing/15 Series"
          git pull --depth=1 origin main -q

          cd "$GITHUB_WORKSPACE"

          # Copy only items that are explicitly symlinked in mll.bio (mode 120000 in git index).
          # This mirrors exactly what Switchboard links locally — no opportunistic copying.
          # For each symlink, read its target, strip the local prefix to get the monorepo-relative path,
          # then copy from the sparse checkout.
          MONO_PREFIX="/Users/mll/Main/"

          copy_symlinked() {
            local content_dir="$1"   # e.g. content/posts
            git ls-files -s "$content_dir" | awk '$1 == "120000" { print $2, $4 }' | \
            while read -r blob_hash link_path; do
              target=$(git cat-file blob "$blob_hash")
              # Strip local prefix to get monorepo-relative path
              rel="${target#$MONO_PREFIX}"
              src="/tmp/main-repo/$rel"
              dest="$link_path"
              if [ -e "$src" ] || [ -d "$src" ]; then
                # Replace the symlink (which CI can't follow) with the real content
                rm -f "$dest"
                cp -r "$src" "$dest"
                echo "Copied: $rel -> $dest"
              else
                echo "Warning: symlink target not found in monorepo: $rel"
              fi
            done
          }

          copy_symlinked "content/posts"
          copy_symlinked "content/series"

      - name: Fetch series assets
        env:
          MAIN_REPO_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}
        run: |
          config="$GITHUB_WORKSPACE/.github/series-assets.yaml"
          if [ ! -f "$config" ]; then
            echo "No series-assets.yaml found, skipping"
            exit 0
          fi
          python3 - <<'EOF'
import yaml, os, subprocess, shutil, sys

config_path = os.environ["GITHUB_WORKSPACE"] + "/.github/series-assets.yaml"
token = os.environ["MAIN_REPO_TOKEN"]
workspace = os.environ["GITHUB_WORKSPACE"]

with open(config_path) as f:
    entries = yaml.safe_load(f) or {}

for slug, repo_url in entries.items():
    print(f"Fetching assets for series: {slug} from {repo_url}")
    auth_url = repo_url.replace("https://github.com/", f"https://x-access-token:{token}@github.com/")
    clone_dir = f"/tmp/assets-{slug}"
    subprocess.run(["git", "clone", "--depth=1", "-q", auth_url, clone_dir], check=True)
    assets_src = os.path.join(clone_dir, "assets")
    assets_dst = os.path.join(workspace, "public", "series", slug, "assets")
    if os.path.isdir(assets_src):
        os.makedirs(os.path.dirname(assets_dst), exist_ok=True)
        if os.path.exists(assets_dst):
            shutil.rmtree(assets_dst)
        shutil.copytree(assets_src, assets_dst)
        count = sum(len(files) for _, _, files in os.walk(assets_dst))
        print(f"  Copied {count} files to public/series/{slug}/assets/")
    else:
        print(f"  Warning: no assets/ directory found in {repo_url}", file=sys.stderr)
EOF

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
