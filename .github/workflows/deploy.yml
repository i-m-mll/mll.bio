name: Deploy to GitHub Pages

on:
  push:
    branches: [main, feature/fix-ci]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch writing content from monorepo
        env:
          MAIN_REPO_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}
        run: |
          # Sparse-checkout 20 Writing/ from i-m-mll/main
          mkdir -p /tmp/main-repo && cd /tmp/main-repo
          git init -q
          git remote add origin "https://x-access-token:${MAIN_REPO_TOKEN}@github.com/i-m-mll/main.git"
          git sparse-checkout init --cone
          git sparse-checkout set "20 Writing/10 Posts" "20 Writing/15 Series"
          git pull --depth=1 origin main -q

          cd "$GITHUB_WORKSPACE"

          # Copy only items that are explicitly symlinked in mll.bio (mode 120000 in git index).
          # This mirrors exactly what Switchboard links locally — no opportunistic copying.
          # For each symlink, read its target, strip the local prefix to get the monorepo-relative path,
          # then copy from the sparse checkout.
          MONO_PREFIX="/Users/mll/Main/"

          copy_symlinked() {
            local content_dir="$1"   # e.g. content/posts
            git ls-files -s "$content_dir" | awk '$1 == "120000" { print $2, $4 }' | \
            while read -r blob_hash link_path; do
              target=$(git cat-file blob "$blob_hash")
              # Strip local prefix to get monorepo-relative path
              rel="${target#$MONO_PREFIX}"
              src="/tmp/main-repo/$rel"
              dest="$link_path"
              if [ -e "$src" ] || [ -d "$src" ]; then
                # Replace the symlink (which CI can't follow) with the real content
                rm -f "$dest"
                cp -r "$src" "$dest"
                echo "Copied: $rel -> $dest"
              else
                echo "Warning: symlink target not found in monorepo: $rel"
              fi
            done
          }

          copy_symlinked "content/posts"
          copy_symlinked "content/series"

      - name: Fetch series assets
        env:
          MAIN_REPO_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}
        run: |
          config="$GITHUB_WORKSPACE/.github/series-assets.yaml"
          if [ ! -f "$config" ]; then
            echo "No series-assets.yaml found, skipping"
            exit 0
          fi
          grep -v '^#' "$config" | grep -v '^[[:space:]]*$' | while IFS= read -r line; do
            slug=$(echo "$line" | cut -d: -f1 | tr -d ' ')
            repo_url=$(echo "$line" | sed 's/^[^:]*:[[:space:]]*//')
            [ -z "$slug" ] && continue
            [ -z "$repo_url" ] && continue
            echo "Fetching assets for: $slug from $repo_url"
            auth_url=$(echo "$repo_url" | sed "s|https://github.com/|https://x-access-token:${MAIN_REPO_TOKEN}@github.com/|")
            git clone --depth=1 -q "$auth_url" "/tmp/assets-$slug"
            src="/tmp/assets-$slug/assets"
            dst="$GITHUB_WORKSPACE/public/series/$slug/assets"
            if [ -d "$src" ]; then
              mkdir -p "$(dirname "$dst")"
              rm -rf "$dst"
              cp -r "$src" "$dst"
              count=$(find "$dst" -type f | wc -l | tr -d ' ')
              echo "  Copied $count files -> public/series/$slug/assets/"
            else
              echo "  Warning: no assets/ dir in $repo_url" >&2
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
